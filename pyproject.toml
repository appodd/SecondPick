[project]
name = "shopping-research-agent"
version = "0.1.0"
description = "Local semi-automated shopping and secondhand price research agent."
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "playwright>=1.48.0",
  "pydantic>=2.8.0",
  "rich>=13.7.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27.0"]
monitor = ["tzdata>=2024.1; sys_platform == 'win32'"]
vision = ["httpx>=0.27.0", "Pillow>=10.0.0"]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"
shopping-agent-web = "shopping_agent.web.cli:main"
shopping-agent-import-goofish = "shopping_agent.goofish_import:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"shopping_agent.web" = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
